[variables]
# Nixpacks reads only the major version; the patch release comes from the
# nixpkgs archive pinned below.
NIXPACKS_NODE_VERSION = "22"

# nixpkgsArchive = nixos-26.05 commit with nodejs_22 22.23.4 (Node security
# release of 2026-10-21: Brotli RCE, TLS hostname bypasses). To move Node,
# point it at a newer nixos-26.05 commit.
[phases.setup]
nixpkgsArchive = "da6dc0e7b26060f2f71ce3ef7088fb56ee44fa36"

[phases.build]
cmds = ["node -v", "..."]
